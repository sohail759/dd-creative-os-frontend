services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK}
        NEXT_PUBLIC_ADMIN_API_TOKEN: ${NEXT_PUBLIC_ADMIN_API_TOKEN}
    container_name: creative-os-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"